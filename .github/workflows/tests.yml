name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: pixelsort examples/sunset.png -o /tmp/out.png --angle 45
      - run: pixelsort examples/sunset.png -o /tmp/out2.png --angle 90 --animate /tmp/drip.mp4 --seconds 2
