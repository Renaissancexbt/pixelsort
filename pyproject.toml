[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelsort-glitch"
version = "0.1.0"
description = "Glitch art by sorting pixels"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Renaissancexbt"}]
dependencies = ["Pillow>=9.1"]
keywords = ["glitch", "pixel sort", "generative art", "image", "pillow"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pixelsort = "pixelsort.cli:main"

[tool.setuptools]
packages = ["pixelsort"]
